<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家校手冊</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 36px 20px 60px;
    }

    .credit {
        color: rgba(255,255,255,.85);
        font-size: 13px;
        letter-spacing: 1px;
        margin: 0 0 4px;
        text-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    h1 {
        color: #fff;
        font-size: 34px;
        font-weight: 500;
        margin: 0 0 4px;
        text-shadow: 0 2px 10px rgba(0,0,0,.18);
    }

    .sub {
        color: rgba(255,255,255,.9);
        font-size: 14px;
        margin: 0 0 28px;
    }

    .list {
        width: 720px;
        max-width: 100%;
    }

    .item {
        background: #fff;
        border-radius: 14px;
        padding: 16px 20px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0,0,0,.14);
        transition: transform .12s, box-shadow .12s;
    }

    .item:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.18); }

    .item-date {
        font-size: 16px;
        font-weight: 600;
        color: #202124;
    }

    .item-meta {
        font-size: 12px;
        color: #5f6368;
        margin-top: 4px;
    }

    .badge {
        display: inline-block;
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 10px;
        background: #e8f0fe;
        color: #1a73e8;
        margin-left: 8px;
        vertical-align: 1px;
    }

    .item-arrow { color: #9aa0a6; font-size: 18px; }

    .empty {
        color: rgba(255,255,255,.9);
        font-size: 14px;
        text-align: center;
        line-height: 1.9;
    }

    /* 详情的纸张 */
    .sheet {
        width: 720px;
        max-width: 100%;
        background: #fff;
        border-radius: 6px;
        padding: 30px 34px;
        box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }

    .pv-school { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #1a1a1a; }
    .pv-book { font-size: 12px; color: #666; letter-spacing: 2px; margin-top: 4px; }
    .pv-info { display: flex; gap: 26px; font-size: 13px; color: #333; margin: 16px 0 14px; }
    .pv-sec { font-size: 13px; line-height: 1.9; margin-top: 16px; }
    .pv-sec b { display: block; margin-bottom: 2px; }
    .pv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pv-table th, .pv-table td { border: 1px solid #dcdcdc; padding: 6px 10px; text-align: left; vertical-align: top; }
    .pv-table th { background: #f5f6f7; font-weight: 600; width: 84px; }
    .pv-empty { color: #bbb; }

    .tools {
        display: flex;
        gap: 10px;
        margin: 18px 0 0;
    }

    .btn {
        padding: 10px 22px;
        font-size: 14px;
        font-family: inherit;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all .12s;
    }

    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1765cc; }
    .btn-ghost { background: #fff; color: #3c4043; border-color: #dadce0; }
    .btn-ghost:hover { background: #f1f3f4; }

    .hidden { display: none !important; }

    @media print {
        body { background: #fff; padding: 0; }
        .credit, h1, .sub, .list, .tools { display: none !important; }
        .sheet { box-shadow: none; width: 100%; padding: 0; }
    }
</style>
</head>
<body>
    <p class="credit">Made by Terrel Wu</p>
    <h1>家校手冊</h1>
    <p class="sub">學校發出的功課手冊 · 只供查看</p>

    <div class="list" id="list"></div>
    <p class="empty hidden" id="emptyTip">暫無手冊</p>

    <div class="hidden" id="detailBox">
        <div class="sheet" id="sheet"></div>
        <div class="tools">
            <button class="btn btn-primary" onclick="window.print()">打印 / 保存 PDF</button>
            <button class="btn btn-ghost" onclick="backToList()">返回列表</button>
        </div>
    </div>

<script>
    function escapeText(s) {
        return String(s === undefined || s === null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function b64decodeUnicode(str) {
        try {
            return decodeURIComponent(escape(atob(str)));
        } catch (e) {
            try { return atob(str); } catch (e2) { return ""; }
        }
    }

    function buildSheetHtml(d) {
        var html = "";
        html += '<div class="pv-school">聖路易斯學校</div>';
        html += '<div class="pv-book">家校手冊 · Homework Handbook</div>';
        html += '<div class="pv-info"><span>日期：' + escapeText(d.date) + '</span>';
        html += '<span>班別：' + escapeText(d.cls) + '</span></div>';

        html += '<table class="pv-table"><thead><tr><th>科目</th><th>功課</th></tr></thead><tbody>';
        (d.rows || []).forEach(function (r) {
            var cell;
            if (!r.texts || !r.texts.length) {
                cell = '<span class="pv-empty">—</span>';
            } else if (r.texts.length === 1) {
                cell = escapeText(r.texts[0]);
            } else {
                cell = r.texts.map(function (t, i) { return (i + 1) + '. ' + escapeText(t); }).join('<br>');
            }
            html += '<tr><td>' + escapeText(r.subject) + '</td><td>' + cell + '</td></tr>';
        });
        html += '</tbody></table>';

        if (d.mode === "all") {
            var lessons = (d.lessons || []).filter(function (l) { return l.subject; });
            if (lessons.length) {
                html += '<table class="pv-table" style="margin-top:16px"><thead><tr><th>節次</th><th>科目</th><th>上課內容</th></tr></thead><tbody>';
                lessons.forEach(function (l, i) {
                    html += '<tr><td>第' + (i + 1) + '節</td><td>' + escapeText(l.subject) + '</td><td>' +
                        (l.text ? escapeText(l.text) : '<span class="pv-empty">—</span>') + '</td></tr>';
                });
                html += '</tbody></table>';
            }
            html += '<div class="pv-sec"><b>學校通告</b>' +
                (d.notice ? escapeText(d.notice) : '<span class="pv-empty">（無）</span>') + '</div>';
            html += '<div class="pv-sec"><b>家長聯絡事項</b>' +
                (d.contact ? escapeText(d.contact) : '<span class="pv-empty">（無）</span>') + '</div>';
        }
        return html;
    }

    var records = [];

    function renderList() {
        var list = document.getElementById("list");
        var tip = document.getElementById("emptyTip");
        list.innerHTML = "";
        if (!records.length) {
            tip.classList.remove("hidden");
            return;
        }
        tip.classList.add("hidden");
        records.forEach(function (it, idx) {
            var d = it.d || it;
            var subjects = (d.rows || []).filter(function (r) { return r.texts && r.texts.length; }).length;
            var div = document.createElement("div");
            div.className = "item";
            div.innerHTML =
                '<div style="flex:1">' +
                '<div class="item-date">' + escapeText(d.date) + '<span class="badge">' +
                (d.mode === "all" ? "所有手冊" : "功課") + '</span></div>' +
                '<div class="item-meta">' + escapeText(d.cls) + ' · ' + subjects + ' 科有功課</div>' +
                '</div><span class="item-arrow">›</span>';
            div.onclick = function () { showDetail(idx); };
            list.appendChild(div);
        });
    }

    function showDetail(idx) {
        var it = records[idx];
        if (!it) return;
        document.getElementById("sheet").innerHTML = buildSheetHtml(it.d || it);
        document.getElementById("list").classList.add("hidden");
        document.getElementById("emptyTip").classList.add("hidden");
        document.getElementById("detailBox").classList.remove("hidden");
        window.scrollTo(0, 0);
    }

    function backToList() {
        document.getElementById("detailBox").classList.add("hidden");
        document.getElementById("list").classList.remove("hidden");
        renderList();
    }

    function load() {
        var m = location.hash.match(/^#h=(.+)$/);
        if (m) {
            try {
                var d = JSON.parse(b64decodeUnicode(m[1]));
                records = [{ d: d }];
                document.getElementById("sheet").innerHTML = buildSheetHtml(d);
                document.getElementById("detailBox").classList.remove("hidden");
                document.getElementById("emptyTip").classList.add("hidden");
                return;
            } catch (e) {}
        }
        fetch("homework-data.json", { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (obj) {
                if (!obj) { renderList(); return; }
                records = Array.isArray(obj) ? obj : (obj.issued || []);
                renderList();
            })
            .catch(function () { renderList(); });
    }

    load();
</script>
</body>
</html>
